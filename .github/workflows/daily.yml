name: daily-mix

on:
  schedule:
    # 每天 00:10 UTC = 北京时间 08:10。GitHub 的定时可能延迟几分钟到半小时。
    - cron: "10 0 * * *"
  workflow_dispatch: {}   # 支持手动触发（就是“重新生成”）

permissions:
  contents: write

concurrency:
  group: daily-mix
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate playlist
        run: python export_site.py

      - name: Commit site and cache
        run: |
          git config user.name "daily-mix-bot"
          git config user.email "daily-mix-bot@users.noreply.github.com"
          git add site data
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "daily mix: $(date -u +%F)"
            git push
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=daily-mix --branch=main
